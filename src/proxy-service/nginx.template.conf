# Idée de cette config : 
# - elle sera copiée dans le conteneur
# - puis les variables ${} seront remplacé par les variables d'environnement via envsubst

# Client
server {
    # PORT 443 : port par défaut de HTTPS
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/local.pem;
    ssl_certificate_key /etc/nginx/certs/local-key.pem;

    # On écoute l'URL suivante
    server_name ${CLIENT_SERVER_NAME};

    # Et on redirige les requêtes vers ce service
    location / {
        # hostname du service est 'client' -> c'est le nom du conteneur dans le network 
        proxy_pass http://client:80;

        # Pour permettre le transfert des headers HTTP également
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API
server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/local.pem;
    ssl_certificate_key /etc/nginx/certs/local-key.pem;

    server_name ${API_SERVER_NAME};

    # Taille maximale du corps complet (fichiers et enveloppe multipart inclus).
    client_max_body_size 20m;

    location / {
        proxy_pass http://api:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
